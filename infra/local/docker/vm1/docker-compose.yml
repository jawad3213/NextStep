version: '3.8'

services:
  reverse-proxy:
    image: nginx:stable-alpine
    container_name: nextstep-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - nextstep-network

  frontend:
    image: ${DOCKER_HUB_USER}/nextstep-frontend:latest
    container_name: nextstep-frontend
    restart: unless-stopped
    environment:
      - API_URL=http://${VM1_IP}/api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - nextstep-network

  backend:
    image: ${DOCKER_HUB_USER}/nextstep-backend:latest
    container_name: nextstep-api
    restart: unless-stopped
    environment:
      - DB_HOST=${VM2_IP}
      - MINIO_HOST=${VM2_IP}
      - KEYCLOAK_HOST=${VM1_IP}
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - nextstep-network

  agents:
    image: ${DOCKER_HUB_USER}/nextstep-agents:latest
    container_name: nextstep-agents
    restart: unless-stopped
    env_file: .env
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - nextstep-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: nextstep-auth
    restart: unless-stopped
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://${VM2_IP}:5432/${KC_DB_NAME}
      - KC_DB_USERNAME=${KC_DB_USER}
      - KC_DB_PASSWORD=${KC_DB_PASS}
    command: start-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 40s
      timeout: 10s
      retries: 5
    networks:
      - nextstep-network

networks:
  nextstep-network:
    driver: bridge
