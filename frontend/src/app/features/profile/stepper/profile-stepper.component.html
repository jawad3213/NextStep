<div class="horizontal-stepper-container">
  <div class="w-full px-4 md:px-6 flex items-center justify-between gap-4">
    
    <!-- Connected Node Stepper -->
    <nav class="node-stepper-wrapper">
      <div class="stepper-progress-bar">
        <!-- Background bar -->
        <div class="stepper-track"></div>
        <!-- Active progress fill -->
        <div class="stepper-fill" [style.width.%]="(currentIndex() / (steps.length - 1)) * 100"></div>
      </div>
      
      <div class="stepper-nodes">
        @for (step of steps; track step.id; let i = $index) {
          <button 
            class="stepper-node" 
            [class.active]="currentStep() === step.id"
            [class.completed]="isComplete(step.id) && currentStep() !== step.id"
            [class.future]="!isComplete(step.id) && currentStep() !== step.id"
            (click)="setStep(step.id)"
            [attr.aria-label]="step.label"
          >
            <div class="node-circle">
              @if (isComplete(step.id) && currentStep() !== step.id) {
                <mat-icon class="node-icon">check</mat-icon>
              } @else {
                <mat-icon class="node-icon step-icon">{{ step.icon }}</mat-icon>
              }
            </div>
            <span class="node-label">{{ step.label }}</span>
          </button>
        }
      </div>
    </nav>

    <!-- Import Card — Zety-style two-column split -->
    <div class="flex items-center h-[42px] border border-slate-200 rounded-lg overflow-hidden bg-white shadow-[0_1px_2px_rgba(0,0,0,0.03)] shrink-0 hidden md:flex">
      <button class="px-5 h-full text-[13px] font-semibold text-[#1B4C74] hover:bg-slate-50 transition-colors" (click)="uploadResume.emit()">
        Upload existing resume
      </button>
      <div class="w-px h-6 bg-slate-200 shrink-0"></div>
      <button class="px-5 h-full text-[13px] font-semibold text-[#1B4C74] hover:bg-slate-50 transition-colors" (click)="importLinkedIn.emit()">
        Import LinkedIn profile
      </button>
    </div>

  </div>
</div>
