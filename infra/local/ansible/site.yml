---
# =====================================================
# NextStep - Ansible Deployment Playbook (Local Infra)
# =====================================================
# Ordre: Base → VM2 (Data) → VM1 (App)
# VM2 doit être opérationnelle AVANT VM1 car le backend
# dépend de PostgreSQL, Redis et MinIO sur VM2.
# =====================================================

# ── Phase 1 : Configuration de base sur toutes les VMs ──
- name: Configuration de base des VMs
  hosts: all
  become: yes
  tasks:
    - name: Mise à jour de APT
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Installation des dépendances Docker
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
        state: present

    - name: Ajout de la clé GPG Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Ajout du dépôt Docker
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: Installation de Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Assurer que Docker est lancé
      service:
        name: docker
        state: started
        enabled: yes

    - name: Ajouter vagrant au groupe docker
      user:
        name: vagrant
        groups: docker
        append: yes

# ── Phase 2 : Déploiement VM2 (Data & Monitoring) EN PREMIER ──
- name: Déploiement VM2 (Données & Monitoring)
  hosts: data
  become: yes
  tasks:
    - name: Créer le dossier de déploiement
      file:
        path: /opt/nextstep-data
        state: directory
        mode: '0755'

    - name: Créer le sous-dossier init-scripts
      file:
        path: /opt/nextstep-data/init-scripts
        state: directory
        mode: '0755'

    - name: Créer le sous-dossier prometheus
      file:
        path: /opt/nextstep-data/prometheus
        state: directory
        mode: '0755'

    - name: Copier la configuration Docker Compose VM2
      copy:
        src: ../docker/vm2/docker-compose.yml
        dest: /opt/nextstep-data/docker-compose.yml
        mode: '0644'

    - name: Copier les scripts d'initialisation PostgreSQL
      copy:
        src: ../docker/vm2/init-scripts/
        dest: /opt/nextstep-data/init-scripts/
        mode: '0755'

    - name: Copier la configuration Prometheus
      copy:
        src: ../docker/vm2/prometheus/prometheus.yml
        dest: /opt/nextstep-data/prometheus/prometheus.yml
        mode: '0644'

    - name: Copier le fichier .env.prod
      copy:
        src: ../.env.prod
        dest: /opt/nextstep-data/.env
        mode: '0600'

    - name: Mettre à jour les images VM2
      shell: docker compose pull
      args:
        chdir: /opt/nextstep-data/

    - name: Lancer les containers VM2
      shell: docker compose up -d
      args:
        chdir: /opt/nextstep-data/

    - name: Attendre que PostgreSQL soit prêt
      shell: docker exec nextstep-db pg_isready -U nextstep_user -d nextstep_db
      register: pg_ready
      retries: 30
      delay: 5
      until: pg_ready.rc == 0

# ── Phase 3 : Déploiement VM1 (Applications & Auth) ──
- name: Déploiement VM1 (Applications & Auth)
  hosts: app
  become: yes
  tasks:
    - name: Créer le dossier de déploiement
      file:
        path: /opt/nextstep
        state: directory
        mode: '0755'

    - name: Créer le sous-dossier nginx
      file:
        path: /opt/nextstep/nginx
        state: directory
        mode: '0755'

    - name: Copier la configuration Docker Compose VM1
      copy:
        src: ../docker/vm1/docker-compose.yml
        dest: /opt/nextstep/docker-compose.yml
        mode: '0644'

    - name: Copier la configuration Nginx
      copy:
        src: ../docker/vm1/nginx/nginx.conf
        dest: /opt/nextstep/nginx/nginx.conf
        mode: '0644'

    - name: Copier le fichier .env.prod
      copy:
        src: ../.env.prod
        dest: /opt/nextstep/.env
        mode: '0600'

    - name: Créer le sous-dossier keycloak-config
      file:
        path: /opt/nextstep/keycloak-config
        state: directory
        mode: '0755'

    - name: Créer le sous-dossier keycloak-theme
      file:
        path: /opt/nextstep/keycloak-theme
        state: directory
        mode: '0755'

    - name: Copier la configuration du realm Keycloak
      copy:
        src: ../../../deploy/keycloak/import/realm-export.json
        dest: /opt/nextstep/keycloak-config/realm-export.json
        mode: '0644'

    - name: Adapter le client Keycloak a l'IP de VM1
      replace:
        path: /opt/nextstep/keycloak-config/realm-export.json
        regexp: 'http://localhost:4200'
        replace: "http://{{ ansible_host }}"

    - name: Copier les thèmes Keycloak
      copy:
        src: ../../../deploy/keycloak/themes/
        dest: /opt/nextstep/keycloak-theme/
        mode: '0644'
        directory_mode: '0755'

    - name: Pull les images Docker depuis Docker Hub
      shell: docker compose pull
      args:
        chdir: /opt/nextstep/

    - name: Lancer les containers VM1
      shell: docker compose up -d
      args:
        chdir: /opt/nextstep/

    - name: Attendre que le backend soit prêt
      shell: docker exec nextstep-api curl -sf http://localhost:5000/health || exit 1
      register: backend_ready
      retries: 30
      delay: 10
      until: backend_ready.rc == 0
      ignore_errors: yes
