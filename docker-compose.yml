# Docker Compose configuration for NextStep
services:
  db:
    image: pgvector/pgvector:pg15
    container_name: nextstep-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nextstep_db}
      POSTGRES_MULTIPLE_DATABASES: ${KEYCLOAK_DB:-keycloak_db}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql
      - ./postgres/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/00-create-multiple-postgresql-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-nextstep_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nextstep-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: nextstep-auth
    command: start-dev --db-schema=keycloak_schema --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${KEYCLOAK_DB:-keycloak_db}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./keycloak-theme/nextstep:/opt/keycloak/themes/nextstep
      - ./keycloak-config:/opt/keycloak/data/import
    networks:
      - nextstep-network

  redis:
    image: redis:7-alpine
    container_name: nextstep-cache
    restart: always
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nextstep-network

  backend:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: nextstep-api
    restart: always
    working_dir: /src
    command: dotnet watch run --urls "http://0.0.0.0:5000"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - ConnectionStrings__DefaultConnection=Host=db;Database=${POSTGRES_DB:-nextstep_db};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Keycloak__Authority=http://keycloak:8080/realms/Next-Step
      - Redis__Configuration=redis:6379
      - PythonAgents__Url=http://agents-python:8000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/src
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - nextstep-network

  agents-python:
    image: python:3.12-slim
    container_name: nextstep-agents
    restart: always
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nextstep_db}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - KEYCLOAK_URL=http://keycloak:8080
      - BACKEND_URL=http://backend:5000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./agents:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nextstep-network

  frontend:
    image: node:22-alpine
    container_name: nextstep-ui
    restart: always
    working_dir: /app
    command: >
      sh -c "npm install &&
             npx ng serve --host 0.0.0.0 --port 4200 --poll 2000"
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - nextstep-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  nextstep-network:
    driver: bridge
