# ============================================================
# NextStep — base Compose file (shared by every environment)
#
# Never run this file alone. Combine it with an environment override:
#   Dev : docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# This file holds what is identical everywhere: images, internal wiring,
# healthchecks, startup order, volumes. It publishes NO ports.
# Values come from .env (see .env.example).
# ============================================================
name: nextstep

services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nextstep_db}
      POSTGRES_MULTIPLE_DATABASES: ${KEYCLOAK_DB:-keycloak_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_config/postgres/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/00-create-multiple-postgresql-databases.sh:ro
      - ./init_config/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [nextstep-network]

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${KEYCLOAK_DB:-keycloak_db}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Used by the realm import (placeholders in realm-export.json)
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./init_config/keycloak/themes:/opt/keycloak/themes:ro
      - ./init_config/keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/8080' || exit 1"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [nextstep-network]

  backend:
    build:
      context: ./backend
      target: production
    image: ${IMAGE_PREFIX:-nextstep}/backend:${IMAGE_TAG:-latest}
    env_file: [.env]
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-nextstep_db};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      PythonAgents__Url: http://agents:8000
      AgentsService__BaseUrl: http://agents:8000
      # Local disk storage (served under /uploads). MinIO: see the "minio" service below.
      Storage__Mode: ${STORAGE_MODE:-Local}
      Minio__Endpoint: http://minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:-}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-}
      Minio__BucketName: nextstep-cvs
    volumes:
      - backend_storage:/app/storage
      - backend_dataprotection_keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      db: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [nextstep-network]

  agents:
    build:
      context: ./agents
      target: production
    image: ${IMAGE_PREFIX:-nextstep}/agents:${IMAGE_TAG:-latest}
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nextstep_db}
      DOTNET_BACKEND_URL: http://backend:5000
      BACKEND_URL: http://backend:5000
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [nextstep-network]

  frontend:
    build:
      context: ./frontend
      target: production
    image: ${IMAGE_PREFIX:-nextstep}/frontend:${IMAGE_TAG:-latest}
    depends_on:
      backend: { condition: service_healthy }
    networks: [nextstep-network]

  # Optional S3 storage. Off by default: MinIO no longer publishes public
  # images on Docker Hub, so set MINIO_IMAGE to an image you can pull, then run
  # with `--profile minio` and STORAGE_MODE=Minio.
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    profiles: [minio]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio_data:/data
    networks: [nextstep-network]

volumes:
  postgres_data:
  backend_storage:
  backend_dataprotection_keys:
  minio_data:

networks:
  nextstep-network:
