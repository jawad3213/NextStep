<div style="padding: 2rem; text-align: center;">
  <h1>Hello in dashboard</h1>
  
  <button

    style="margin-top: 2rem; padding: 10px 20px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: background-color 0.2s;"
