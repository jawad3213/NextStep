<div class="offers-layout h-full flex flex-col">
  <div class="stepper-wrapper shrink-0">
    <app-offers-stepper
      [steps]="steps"
      [currentStep]="currentOfferStepId()"
      [stepStates]="offerStepStates()"
      (stepClick)="goToOfferStep($any($event))"
    ></app-offers-stepper>
  </div>

  <!-- Scrollable Page Content -->
  <div class="flex-1 overflow-auto bg-gray-50/50">
    <div class="max-w-[1200px] mx-auto px-4 md:px-12 py-8 lg:py-12">
      <div class="step-content-container">
        @switch (currentOfferStepId()) {
          @case ('submit') {
            <app-step-submit></app-step-submit>
          }
          @case ('analysis') {
            <app-step-analysis></app-step-analysis>
          }
          @case ('template') {
            <app-step-template></app-step-template>
          }
          @case ('generation') {
            <app-step-generation></app-step-generation>
          }
          @case ('results') {
            <app-step-results></app-step-results>
          }
        }
      </div>
    </div>
  </div>
</div>
