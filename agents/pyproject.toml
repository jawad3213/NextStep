# ============================================================
# agents/pyproject.toml
# Configuration Ruff (linter) + pytest pour le CI
# ============================================================

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = [
    "E501",   # Line too long — géré par le formateur
    "E711",   # Comparison to None — acceptable en LangGraph
    "F401",   # Unused imports dans les __init__.py
]
per-file-ignores = { "**/__init__.py" = ["F401"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --no-header -rN"
