<div class="generation-shell">
  @if (isAwaitingGeneratedCv) {
    <div class="generation-waiting">
      <div class="generation-waiting-card">
        <p class="waiting-eyebrow">Pipeline IA active</p>
        <h3>{{ generationProgressLabel }}</h3>
        <div class="waiting-progress-track">
          <div class="waiting-progress-fill" [style.width.%]="generationProgressPercent"></div>
        </div>
        <div class="waiting-progress-meta">
          <span>Preparation du CV optimise</span>
          <strong>{{ generationProgressPercent }}%</strong>
        </div>

        <div class="waiting-stage-list">
          @for (stage of generationStages; track stage.key) {
            <div class="waiting-stage" [class.running]="getGenerationStageStatus(stage.key) === 'running'" [class.done]="getGenerationStageStatus(stage.key) === 'done'">
              <span class="stage-dot"></span>
              <span>{{ stage.label }}</span>
            </div>
          }
        </div>
      </div>
    </div>
  } @else {
    <app-resume-editor
      [templateId]="selectedTemplate"
      [offerId]="currentOfferId"
      [initialData]="editorInitialData()"
      [renderedHtml]="renderedHtml"
      [designConfig]="currentDesignConfig"
      [isRenderingPreview]="isRenderingPreview"
      [isReoptimizingCv]="isReoptimizingCv"
      [isGeneratingHighQualityPdf]="isGeneratingHighQualityPdf"
      [isSavingFinal]="isSavingFinal"
      [previewError]="previewError"
      (dataChange)="onEditorDataChange($event)"
      (designConfigChange)="onDesignConfigChange($event)"
      (download)="downloadFinalPdf()"
      (reoptimize)="reoptimizeCv()"
      (templateChange)="selectTemplate($event)"
      (back)="goBack()"
      (finishRequested)="continueToResults()"
    />
  }
</div>
