<div class="form-step-wrapper animate-fade-slide-up">
  <!-- Resume summary Header -->
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-semibold text-slate-900">Profile Summary</h2>
    <button (click)="generateAI.emit()" 
            [disabled]="isGeneratingAI"
            class="profile-ta-text-btn">
      <mat-icon class="!w-[18px] !h-[18px] !text-[18px]">auto_awesome</mat-icon> 
      {{ isGeneratingAI ? 'Generating...' : 'Generate with AI' }}
    </button>
  </div>

  <!-- Surface Container -->
  <div class="profile-ta-surface">
    <div class="flex items-center gap-4 mb-5">
      <h3 class="text-[16px] font-bold text-slate-900 uppercase tracking-wide">PROFESSIONAL SUMMARY</h3>
      <div class="flex-1 h-px bg-slate-100"></div>
    </div>

  @if (!resume || resume.length < 50) {
    <div class="flex items-center gap-2 px-4 py-2.5 mb-5 rounded-lg bg-amber-50 border border-amber-200 text-sm text-amber-700">
      <mat-icon class="!text-[18px] !w-[18px] !h-[18px] text-amber-500">description</mat-icon>
      <span>Your professional summary is empty or too short — write at least a few sentences to help recruiters understand your profile.</span>
    </div>
  }

  <div class="rounded-lg border border-gray-300 bg-white p-4 shadow-sm transition-all focus-within:border-brand-300 focus-within:ring-2 focus-within:ring-brand-500/10">
    <textarea 
      [value]="resume"
      (input)="onResumeChange($event)" (blur)="onResumeBlur()"
      class="profile-ta-textarea min-h-[180px] resize-none border-none px-0 py-0 text-sm font-medium leading-relaxed shadow-none focus:ring-0"
      placeholder="Describe your career path, your strengths, and what you are looking for..."></textarea>
  </div>
  </div>
</div>
