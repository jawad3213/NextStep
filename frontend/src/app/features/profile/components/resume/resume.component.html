<div class="form-step-wrapper animate-fade-slide-up">
  <div class="flex items-center justify-between mb-8">
    <div>
      <h2 class="text-[28px] font-black text-[#212121] leading-tight mb-2">Résumé du profil</h2>
      <p class="text-[15px] text-[#757575] font-medium">Rédigez une introduction percutante pour capter l'attention des recruteurs.</p>
    </div>
    
    <button (click)="generateAI.emit()" 
            [disabled]="isGeneratingAI"
            class="bg-[#1A91F0] hover:bg-[#0F6EBB] text-white rounded-xl h-[44px] px-6 text-[15px] font-bold transition-all flex items-center gap-2 shadow-sm disabled:opacity-70 disabled:cursor-not-allowed">
      @if (isGeneratingAI) {
        <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin mr-1"></div>
        Génération...
      } @else {
        <mat-icon class="!w-5 !h-5 !text-[20px]">auto_awesome</mat-icon>
        Générer avec l'IA
      }
    </button>
  </div>

  <div class="bg-white border border-[#EEEEEE] rounded-2xl p-6 shadow-sm focus-within:border-[#1A91F0] transition-all">
    <textarea 
      [value]="resume"
      (input)="onResumeChange($event)"
      class="w-full min-h-[200px] border-none outline-none resize-none bg-transparent text-[16px] leading-relaxed text-[#424242] placeholder:text-[#BDBDBD] font-medium"
      placeholder="Décrivez votre parcours, vos points forts et ce que vous recherchez..."></textarea>
  </div>
</div>
