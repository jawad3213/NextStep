# ============================================================
# NextStep — PRODUCTION overrides (use with docker-compose.yml)
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# - Only the nginx reverse proxy is exposed (port ${HTTP_PORT:-80});
#   it routes /api, /hubs, /uploads -> backend, /agents -> agents,
#   /auth -> Keycloak and everything else -> frontend.
# - To deploy prebuilt images instead of building on the server, set
#   IMAGE_PREFIX / IMAGE_TAG in .env and run `docker compose ... pull` first.
# - TLS: terminate HTTPS in front of this proxy (load balancer, Caddy,
#   Cloudflare…) and set PUBLIC_URL to the https:// address.
# ============================================================

x-prod: &prod
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  reverse-proxy:
    <<: *prod
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./init_config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend: { condition: service_healthy }
      backend: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    deploy:
      resources: { limits: { cpus: "0.5", memory: 256M } }
    networks: [nextstep-network]

  db:
    <<: *prod
    deploy:
      resources: { limits: { cpus: "1.0", memory: 1G } }

  keycloak:
    <<: *prod
    command: start --db-schema=keycloak_schema --import-realm
    environment:
      KC_HTTP_ENABLED: "true"            # TLS is terminated before the proxy
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
    deploy:
      resources: { limits: { cpus: "1.0", memory: 1G } }

  backend:
    <<: *prod
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Keycloak__Authority: http://keycloak:8080/auth/realms/Next-Step
      Keycloak__RequireHttpsMetadata: "false"   # internal hop; public traffic is HTTPS
      App__PublicBaseUrl: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      App__FrontendBaseUrl: ${PUBLIC_URL}
      GoogleOAuth__RedirectUri: ${PUBLIC_URL}/api/email-connections/google/callback
      Minio__PublicUrl: ${MINIO_PUBLIC_URL:-}
    deploy:
      resources: { limits: { cpus: "1.0", memory: 1G } }

  agents:
    <<: *prod
    environment:
      KEYCLOAK_URL: http://keycloak:8080/auth
    deploy:
      resources: { limits: { cpus: "1.0", memory: 1G } }

  frontend:
    <<: *prod
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources: { limits: { cpus: "0.5", memory: 256M } }

  minio:
    <<: *prod
