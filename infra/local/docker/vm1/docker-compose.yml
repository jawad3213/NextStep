services:
  reverse-proxy:
    image: nginx:stable-alpine
    container_name: nextstep-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - nextstep-network

  frontend:
    image: ${DOCKER_HUB_NAMESPACE}/nextstep-frontend:latest
    container_name: nextstep-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - nextstep-network

  backend:
    image: ${DOCKER_HUB_NAMESPACE}/nextstep-backend:latest
    container_name: nextstep-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=5000
      - ConnectionStrings__DefaultConnection=Host=${VM2_IP};Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASS}
      - Redis__Configuration=${VM2_IP}:6379
      - Minio__Endpoint=http://${VM2_IP}:9000
      - Minio__PublicUrl=http://${VM2_IP}:9000
      - Minio__AccessKey=${MINIO_USER}
      - Minio__SecretKey=${MINIO_PASS}
      - Minio__BucketName=nextstep-cvs
      - AgentsService__BaseUrl=http://agents:8000
      - PythonAgents__Url=http://agents:8000
      - Keycloak__Authority=http://keycloak:8080/auth/realms/Next-Step
      - Keycloak__RequireHttpsMetadata=false
      - App__FrontendBaseUrl=http://${VM1_IP}
      - GoogleOAuth__RedirectUri=http://${VM1_IP}/api/email-connections/google/callback
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      keycloak:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - nextstep-network

  agents:
    image: ${DOCKER_HUB_NAMESPACE}/nextstep-agents:latest
    container_name: nextstep-agents
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASS}@${VM2_IP}:5432/${DB_NAME}
      - KEYCLOAK_URL=http://keycloak:8080/auth
      - BACKEND_URL=http://backend:5000
    env_file: .env
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - nextstep-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: nextstep-auth
    restart: unless-stopped
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://${VM2_IP}:5432/${KC_DB_NAME}
      - KC_DB_USERNAME=${KC_DB_USER}
      - KC_DB_PASSWORD=${KC_DB_PASS}
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_PROXY_HEADERS=xforwarded
      - KC_HEALTH_ENABLED=true
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    command: start-dev --import-realm
    volumes:
      - ./keycloak-config/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak-theme/nextstep:/opt/keycloak/themes/nextstep:ro
      - ./keycloak-theme/jaouad:/opt/keycloak/themes/jaouad:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - nextstep-network

networks:
  nextstep-network:
    driver: bridge
