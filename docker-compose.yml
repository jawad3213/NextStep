version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: nextstep-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-nextstep_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-nextstep_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nextstep-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: nextstep-auth
    command: start-dev --db-schema=keycloak_schema
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nextstep_db}
      KC_DB_USERNAME: ${POSTGRES_USER:-admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nextstep-network

  redis:
    image: redis:7-alpine
    container_name: nextstep-cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nextstep-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextstep-api
    restart: always
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB:-nextstep_db};Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD:-password}
      - Keycloak__Authority=http://keycloak:8080/realms/nextstep
      - Redis__Configuration=redis:6379
      - PythonAgents__Url=http://agents-python:8000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - nextstep-network

  agents-python:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: nextstep-agents
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-nextstep_db}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - KEYCLOAK_URL=http://keycloak:8080
      - BACKEND_URL=http://backend:5000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nextstep-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextstep-ui
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - nextstep-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  nextstep-network:
    driver: bridge
