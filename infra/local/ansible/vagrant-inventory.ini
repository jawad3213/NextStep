[app]
vm1 ansible_host=192.168.169.10 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/nextstep/vm1_key

[data]
vm2 ansible_host=192.168.169.11 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/nextstep/vm2_key

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAcceptedKeyTypes=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa'
