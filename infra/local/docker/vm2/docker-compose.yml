services:
  database:
    image: pgvector/pgvector:pg15
    container_name: nextstep-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_MULTIPLE_DATABASES=${KC_DB_NAME}:${KC_DB_USER}:${KC_DB_PASS},sonardb:${SONAR_DB_USER}:${SONAR_DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - nextstep_db_data:/var/lib/postgresql/data
      - ./init-scripts/create-multiple-databases.sh:/docker-entrypoint-initdb.d/00-create-multiple-databases.sh
      - ./init-scripts/init.sql:/docker-entrypoint-initdb.d/10-init.sql
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - nextstep-data-network

  redis:
    image: redis:7-alpine
    container_name: nextstep-cache
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - nextstep_redis_data:/data
    networks:
      - nextstep-data-network

  minio:
    image: minio/minio
    container_name: nextstep-storage
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASS}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - nextstep_minio_data:/data
    networks:
      - nextstep-data-network

  sonarqube:
    image: sonarqube:lts-community
    container_name: nextstep-sonarqube
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "9005:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://database:5432/sonardb
      - SONAR_JDBC_USERNAME=${SONAR_DB_USER}
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASS}
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3G
    volumes:
      - nextstep_sonar_data:/opt/sonarqube/data
      - nextstep_sonar_extensions:/opt/sonarqube/extensions
      - nextstep_sonar_logs:/opt/sonarqube/logs
    networks:
      - nextstep-data-network

  prometheus:
    image: prom/prometheus
    container_name: nextstep-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - nextstep_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - nextstep-data-network

  grafana:
    image: grafana/grafana
    container_name: nextstep-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - nextstep_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - nextstep-data-network

networks:
  nextstep-data-network:
    driver: bridge

volumes:
  nextstep_db_data:
  nextstep_redis_data:
  nextstep_minio_data:
  nextstep_sonar_data:
  nextstep_sonar_extensions:
  nextstep_sonar_logs:
  nextstep_prometheus_data:
  nextstep_grafana_data:
