<div class="form-step-wrapper animate-fade-slide-up">
  <!-- Resume summary Header -->
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-[24px] font-bold text-slate-900">Profile Summary</h2>
    <button (click)="generateAI.emit()" 
            [disabled]="isGeneratingAI"
            class="flex items-center gap-1 text-[14px] font-semibold text-[#1A91F0] hover:text-[#0F6EBB] transition-colors disabled:opacity-50">
      <mat-icon class="!w-[18px] !h-[18px] !text-[18px]">auto_awesome</mat-icon> 
      {{ isGeneratingAI ? 'Generating...' : 'Generate with AI' }}
    </button>
  </div>

  <!-- Surface Container -->
  <div class="bg-white rounded-[16px] p-6 border border-slate-200">
    <div class="flex items-center gap-4 mb-5">
      <h3 class="text-[16px] font-bold text-slate-900 uppercase tracking-wide">PROFESSIONAL SUMMARY</h3>
      <div class="flex-1 h-px bg-slate-100"></div>
    </div>

  <div class="bg-white border border-[#EEEEEE] rounded-2xl p-6 shadow-sm focus-within:border-[#1A91F0] transition-all">
    <textarea 
      [value]="resume"
      (input)="onResumeChange($event)"
      class="w-full min-h-[200px] border-none outline-none resize-none bg-transparent text-[16px] leading-relaxed text-[#424242] placeholder:text-[#BDBDBD] font-medium"
      placeholder="Describe your career path, your strengths, and what you are looking for..."></textarea>
  </div>
  </div>
</div>
