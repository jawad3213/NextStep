---
- name: Configuration de base des VMs
  hosts: all
  become: yes
  tasks:
    - name: Mise à jour de APT
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Installation des dépendances Docker
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
        state: present

    - name: Ajout de la clé GPG Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Ajout du dépôt Docker
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: Installation de Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Assurer que Docker est lancé
      service:
        name: docker
        state: started
        enabled: yes

- name: Déploiement VM1 (Applications & Auth)
  hosts: app
  become: yes
  tasks:
    - name: Créer le dossier de déploiement
      file:
        path: /opt/nextstep
        state: directory
        mode: '0755'

    - name: Copier la configuration Docker Compose VM1
      copy:
        src: ../docker/vm1/
        dest: /opt/nextstep/
        mode: '0644'

    - name: Copier le fichier .env.prod
      copy:
        src: ../.env.prod
        dest: /opt/nextstep/.env
        mode: '0600'

    - name: Lancer les containers VM1
      shell: docker compose up -d
      args:
        chdir: /opt/nextstep/

- name: Déploiement VM2 (Données & Monitoring)
  hosts: data
  become: yes
  tasks:
    - name: Créer le dossier de déploiement
      file:
        path: /opt/nextstep-data
        state: directory
        mode: '0755'

    - name: Copier la configuration Docker Compose VM2
      copy:
        src: ../docker/vm2/
        dest: /opt/nextstep-data/
        mode: '0644'

    - name: Copier le fichier .env.prod
      copy:
        src: ../.env.prod
        dest: /opt/nextstep-data/.env
        mode: '0600'

    - name: Lancer les containers VM2
      shell: docker compose up -d
      args:
        chdir: /opt/nextstep-data/
