# ============================================================
# Playbook Principal — Déploiement NextStep sur 2 VMs
# Usage: ansible-playbook -i inventory.ini deploy.yml
# ============================================================

---
- name: "🗄️ Configurer le serveur Base de Données (VM2)"
  hosts: db
  become: true
  vars:
    postgres_version: "15"
    postgres_user: "admin"
    postgres_password: "{{ vault_postgres_password | default('admin') }}"
    postgres_db: "nextstep_db"
    keycloak_db: "keycloak_db"

  tasks:
    # ── Installation Docker ──────────────────────────────────
    - name: "📦 Installer les prérequis système"
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
        state: present
        update_cache: true

    - name: "🐳 Ajouter la clé GPG Docker"
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: "🐳 Ajouter le dépôt Docker"
      apt_repository:
        repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: "🐳 Installer Docker Engine"
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: "🐳 Démarrer Docker"
      systemd:
        name: docker
        state: started
        enabled: true

    - name: "👤 Ajouter l'utilisateur vagrant au groupe docker"
      user:
        name: vagrant
        groups: docker
        append: true

    # ── Déploiement PostgreSQL + Redis + Keycloak ────────────
    - name: "📁 Créer le répertoire de déploiement DB"
      file:
        path: /opt/nextstep/db
        state: directory
        mode: "0755"

    - name: "📝 Copier le docker-compose DB"
      copy:
        dest: /opt/nextstep/db/docker-compose.yml
        content: |
          version: '3.8'
          services:
            db:
              image: pgvector/pgvector:pg15
              container_name: nextstep-db
              restart: always
              environment:
                POSTGRES_USER: {{ postgres_user }}
                POSTGRES_PASSWORD: {{ postgres_password }}
                POSTGRES_DB: {{ postgres_db }}
              ports:
                - "5432:5432"
              volumes:
                - pgdata:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U {{ postgres_user }}"]
                interval: 5s
                timeout: 5s
                retries: 5

            redis:
              image: redis:7-alpine
              container_name: nextstep-cache
              restart: always
              ports:
                - "6379:6379"
              volumes:
                - redis_data:/data

            keycloak:
              image: quay.io/keycloak/keycloak:24.0
              container_name: nextstep-auth
              command: start-dev
              environment:
                KC_DB: postgres
                KC_DB_URL: jdbc:postgresql://db:5432/{{ keycloak_db }}
                KC_DB_USERNAME: {{ postgres_user }}
                KC_DB_PASSWORD: {{ postgres_password }}
                KEYCLOAK_ADMIN: admin
                KEYCLOAK_ADMIN_PASSWORD: {{ postgres_password }}
              ports:
                - "8080:8080"
              depends_on:
                db:
                  condition: service_healthy

          volumes:
            pgdata:
            redis_data:

    - name: "🚀 Démarrer les services DB"
      shell: docker compose up -d
      args:
        chdir: /opt/nextstep/db

    - name: "⏳ Attendre que PostgreSQL soit prêt"
      shell: docker exec nextstep-db pg_isready -U {{ postgres_user }}
      retries: 10
      delay: 3
      register: pg_ready
      until: pg_ready.rc == 0

# =============================================================================

- name: "🖥️ Configurer le serveur Application (VM1)"
  hosts: app
  become: true
  vars:
    app_repo: "https://github.com/votre-org/NextStep.git"
    db_host: "192.168.99.11"
    postgres_user: "admin"
    postgres_password: "{{ vault_postgres_password | default('admin') }}"

  tasks:
    # ── Installation Docker ──────────────────────────────────
    - name: "📦 Installer les prérequis système"
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
          - git
        state: present
        update_cache: true

    - name: "🐳 Ajouter la clé GPG Docker"
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: "🐳 Ajouter le dépôt Docker"
      apt_repository:
        repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: "🐳 Installer Docker Engine"
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: "🐳 Démarrer Docker"
      systemd:
        name: docker
        state: started
        enabled: true

    - name: "👤 Ajouter vagrant au groupe docker"
      user:
        name: vagrant
        groups: docker
        append: true

    # ── Déploiement de l'Application ─────────────────────────
    - name: "📁 Créer le répertoire de déploiement"
      file:
        path: /opt/nextstep/app
        state: directory
        mode: "0755"

    - name: "📝 Copier le fichier .env"
      copy:
        dest: /opt/nextstep/app/.env
        mode: "0600"
        content: |
          POSTGRES_USER={{ postgres_user }}
          POSTGRES_PASSWORD={{ postgres_password }}
          POSTGRES_DB=nextstep_db
          DATABASE_URL=postgresql+asyncpg://{{ postgres_user }}:{{ postgres_password }}@{{ db_host }}:5432/nextstep_db
          GROQ_API_KEY={{ groq_api_key | default('') }}
          KEYCLOAK_DB=keycloak_db

    - name: "📝 Copier le docker-compose Application"
      copy:
        dest: /opt/nextstep/app/docker-compose.yml
        content: |
          version: '3.8'
          services:
            backend:
              image: nextstep-api:latest
              container_name: nextstep-api
              restart: always
              env_file: .env
              environment:
                - ASPNETCORE_ENVIRONMENT=Production
                - ConnectionStrings__DefaultConnection=Host={{ db_host }};Database=nextstep_db;Username={{ postgres_user }};Password={{ postgres_password }}
                - Keycloak__Authority=http://{{ db_host }}:8080/realms/Next-Step
                - Redis__Configuration={{ db_host }}:6379
                - PythonAgents__Url=http://agents-python:8000
                - Minio__Endpoint=http://minio:9000
              ports:
                - "5000:5000"
              depends_on:
                - agents-python
                - minio

            agents-python:
              image: nextstep-agents:latest
              container_name: nextstep-agents
              restart: always
              env_file: .env
              ports:
                - "8000:8000"

            minio:
              image: minio/minio
              container_name: nextstep-storage
              restart: always
              command: server /data --console-address ":9001"
              ports:
                - "9000:9000"
                - "9001:9001"
              volumes:
                - minio_data:/data

            frontend:
              image: nextstep-ui:latest
              container_name: nextstep-ui
              restart: always
              ports:
                - "80:80"

          volumes:
            minio_data:

    - name: "🚀 Démarrer les services Application"
      shell: docker compose up -d
      args:
        chdir: /opt/nextstep/app

# =============================================================================

- name: "✅ Vérification finale"
  hosts: all
  become: true
  tasks:
    - name: "🔍 Vérifier les containers en cours"
      shell: docker ps --format '{{ '{{' }}.Names{{ '}}' }} — {{ '{{' }}.Status{{ '}}' }}'
      register: containers

    - name: "📋 Afficher l'état des containers"
      debug:
        var: containers.stdout_lines
