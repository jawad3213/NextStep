global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # NextStep Backend API (VM1)
  - job_name: 'nextstep-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['192.168.169.10:5000']
        labels:
          instance: 'vm1-backend'

  # PostgreSQL (local VM2)
  - job_name: 'postgres'
    static_configs:
      - targets: ['database:5432']
        labels:
          instance: 'vm2-database'

  # Redis (local VM2)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          instance: 'vm2-redis'

  # MinIO (local VM2)
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']
        labels:
          instance: 'vm2-minio'
