# NextStep — production reverse proxy (used by docker-compose.prod.yml)
# Single public entry point; matches frontend/src/environments/environment.prod.ts
#   /api/     -> backend      (REST)
#   /hubs/    -> backend      (SignalR websockets)
#   /uploads/ -> backend      (files stored with Storage:Mode=Local)
#   (the agents service is internal: only the backend calls it)
#   /auth/    -> keycloak     (KC_HTTP_RELATIVE_PATH=/auth)
#   /         -> frontend     (Angular static build)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    client_max_body_size 50M;

    # Websocket upgrade support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Keep the original scheme when TLS is terminated in front of this proxy
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://backend:5000;
            proxy_read_timeout 300s;        # AI pipeline calls can be slow
        }

        location /hubs/ {
            proxy_pass http://backend:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        location /uploads/ {
            proxy_pass http://backend:5000;
        }

        location /auth/ {
            proxy_pass http://keycloak:8080;
            proxy_buffer_size       128k;
            proxy_buffers           4 256k;
            proxy_busy_buffers_size 256k;
        }

        location / {
            proxy_pass http://frontend:8080;
        }
    }
}
